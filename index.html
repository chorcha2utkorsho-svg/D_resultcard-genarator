    <meta name="description" content="ডি-লিকন মডেল একাডেমীর জন্য স্মার্ট মার্ক এন্ট্রি, অটোমেটিক রেজাল্ট শিট ও প্রোগ্রেস কার্ড জেনারেটর, সিলেবাস, প্রশ্নপত্র ও নোট ম্যানেজমেন্ট সিস্টেম।" />
    <meta property="og:title" content="ডি-লিকন মডেল একাডেমী - ডিজিটাল রেজাল্ট ও স্কুল ম্যানেজমেন্ট" />
    <meta property="og:description" content="ডি-লিকন মডেল একাডেমীর জন্য স্মার্ট মার্ক এন্ট্রি, অটোমেটিক রেজাল্ট শিট ও প্রোগ্রেস কার্ড জেনারেটর, সিলেবাস, প্রশ্নপত্র ও নোট ম্যানেজমেন্ট সিস্টেম।" />

  <body class="font-sans antialiased text-slate-800 bg-slate-50 min-h-screen">
    <script>
      // Capture PWA install prompt early before React mounts any child views
      window.__dlikonDeferredPrompt = null;
      window.__dlikonPwaInstalled = false;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__dlikonDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('dlikon-pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.__dlikonDeferredPrompt = null;
        window.__dlikonPwaInstalled = true;
        window.dispatchEvent(new CustomEvent('dlikon-pwa-installed'));
      });

      // Suppress benign Vite dev server HMR websocket connection warnings in preview iframes
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('@vite/client'))) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('@vite/client'))) {
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
